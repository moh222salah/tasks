<script>
/* ===== NDS Enterprise Operations — in-browser simulation of the handover engine =====
   Same rules as the Frappe app (services/handover.py): identity from the session, snapshot + SHA-256,
   responsibility moves only on acceptance, append-only ledger with unique (task, sequence),
   idempotent submit, explicit delegation, required vs mutable notifications. */
function sha256(str){
  var s=unescape(encodeURIComponent(str)),mp=Math.pow,mw=mp(2,32),i,j,res='',w=[],bl=s.length*8;
  var h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,comp={};
  for(var c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
  h=h.slice(0,8);s+='\x80';while(s.length%64-56)s+='\x00';
  for(i=0;i<s.length;i++){j=s.charCodeAt(i);w[i>>2]|=j<<((3-i)%4)*8}
  w[w.length]=((bl/mw)|0);w[w.length]=(bl);
  for(j=0;j<w.length;){var ww=w.slice(j,j+=16),oh=h;h=h.slice(0,8);
    for(i=0;i<64;i++){var w15=ww[i-15],w2=ww[i-2],a=h[0],e=h[4];
      var t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(ww[i]=(i<16)?ww[i]:(ww[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+ww[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;h.pop()}
    for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0}
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}
  return res;
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
}
class NdsError extends Error{constructor(m,code){super(m);this.code=code||'valid'}}
const fail=(m,c)=>{throw new NdsError(m,c)};
const H=3600e3,D=24*H;
const ROLE={EXEC:'NDS Executive Management',OPS:'NDS Operations Manager',DEPT:'NDS Department Manager',LEAD:'NDS Team Leader',REV:'NDS Task Reviewer',AUD:'NDS Read Only Auditor',SYS:'System Manager'};
const REASONS=['Missing Information','Incomplete Work','Missing Attachments','Technical Issues','Incorrect Diagnosis','Unclear Instructions','Unverified Results','Wrong Assignment','Other'];
const OPEN_H=['Pending Acceptance','Under Review','Clarification Requested'];
const CLOSED_T=['Completed','Cancelled'];
const USERS={
 sara:{name:'Sara Ahmed',dept:'Marketing',team:'Content Team',job:'Content Specialist',roles:['Employee','NDS Task Sender','NDS Task Executor']},
 omar:{name:'Omar Hassan',dept:'Technology',team:'ERP Squad',job:'ERPNext Developer',roles:['Employee','NDS Task Receiver','NDS Task Executor']},
 mona:{name:'Mona Said',dept:'Technology',team:'ERP Squad',job:'QA Engineer',roles:['Employee','NDS Task Receiver','NDS Task Executor']},
 lina:{name:'Lina Farouk',dept:'Technology',team:'ERP Squad',job:'Team Leader',roles:['Employee',ROLE.LEAD]},
 khaled:{name:'Khaled Mansour',dept:'Technology',team:'',job:'Head of Technology',roles:['Employee',ROLE.DEPT]},
 huda:{name:'Huda Salem',dept:'Marketing',team:'',job:'Head of Marketing',roles:['Employee',ROLE.DEPT]},
 noura:{name:'Noura Adel',dept:'Executive Management',team:'',job:'Operations Director',roles:[ROLE.EXEC,ROLE.OPS]},
 rana:{name:'Rana Younes',dept:'Quality & Compliance',team:'',job:'Quality Reviewer',roles:['Employee',ROLE.REV]},
 adel:{name:'Adel Auditor',dept:'Quality & Compliance',team:'',job:'Read Only Auditor',roles:[ROLE.AUD]},
 admin:{name:'Administrator',dept:'',team:'',job:'System Administrator',roles:['Administrator',ROLE.SYS]}
};
const TEAMS=[{name:'Content Team',dept:'Marketing',lead:'huda'},{name:'Design Studio',dept:'Marketing',lead:'huda'},{name:'ERP Squad',dept:'Technology',lead:'lina'},{name:'Web Team',dept:'Technology',lead:'khaled'}];
const DEPTS=['Marketing','Technology','Finance & Accounting','Human Resources','Quality & Compliance','Executive Management'];
let S=null;
const uname=u=>USERS[u]?USERS[u].name:(u||'—');
const now=()=>Date.now()+S.clock;
const pad=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const dateOf=t=>fmt(t).slice(0,10);
const hasRole=(u,r)=>USERS[u].roles.includes(r);
const isFull=u=>[ROLE.EXEC,ROLE.OPS,ROLE.AUD,ROLE.SYS,'Administrator'].some(r=>hasRole(u,r));
const isManager=u=>isFull(u)||hasRole(u,ROLE.DEPT)||hasRole(u,ROLE.OPS);
const id=(p)=>p+'-'+String(++S.seq[p]).padStart(4,'0');
function blank(){return{clock:0,seq:{HOV:0,TASK:0,UPD:0,CHK:0,REV:0,DEL:0,NTF:0,TRV:0,ATT:0},tasks:[],handovers:[],reviews:[],history:[],ledger:[],updates:[],checklist:[],taskReviews:[],delegations:[],notifications:[],prefs:{},requests:{},settings:{responseHours:24,leadHours:4,escalateHours:24},kpi:[]}}
function ownerOf(tid){const rows=S.ledger.filter(r=>r.task===tid);if(rows.length)return rows[rows.length-1].to;return S.tasks.find(t=>t.id===tid).assignee}
function pastOwners(tid){const t=S.tasks.find(x=>x.id===tid),s=new Set([t.assignee,t.creator]);S.ledger.filter(r=>r.task===tid).forEach(r=>{s.add(r.from);s.add(r.to)});return s}
function getH(i){const h=S.handovers.find(x=>x.id===i);if(!h)fail('Handover '+i+' does not exist.');return h}
function getT(i){const t=S.tasks.find(x=>x.id===i);if(!t)fail('Task '+i+' does not exist.');return t}
function log(h,event,user,text,cls){S.history.push({id:S.history.length+1,handover:h.id,task:h.task,event,user,text:text||'',cls:cls||'',at:now()})}
function activeDelegation(delegate,delegator,at){at=at||now();return S.delegations.find(d=>!d.revoked&&d.delegate===delegate&&d.delegator===delegator&&Date.parse(d.from)<=at&&at<=Date.parse(d.to)+D-1)}
function canDecide(h,u){if(u===h.sender)return false;if(u===h.receiver)return true;return !!activeDelegation(u,h.receiver)}
function leads(u){return TEAMS.filter(t=>t.lead===u).map(t=>t.name)}
function canSeeH(h,u){
  if(h.status==='Draft')return u===h.sender||isFull(u)&&!hasRole(u,ROLE.AUD)||hasRole(u,ROLE.SYS);
  if(isFull(u))return true;
  if(u===h.sender||u===h.receiver||activeDelegation(u,h.receiver))return true;
  const lt=leads(u);if(lt.includes(h.senderTeam)||lt.includes(h.receiverTeam))return true;
  if(hasRole(u,ROLE.DEPT)&&(USERS[u].dept===h.senderDept||USERS[u].dept===h.receiverDept))return true;
  return false}
function canSeeT(t,u){

  if(tab==='kpi'){const per=dateOf(now()).slice(0,7),rows=perGroup(me,DEF,'dept');body='<div class="cb">Month <b>'+per+'</b>. A snapshot freezes the numbers so later changes cannot rewrite history. '+(isManager(me)?'<button class="btn sm" data-do="freeze">Freeze this month</button>':'<span class="muted">Managers can freeze it.</span>')+'</div>'+

  return ph(t('Records'))+'<div class="tabs">'+tabs.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" data-do="go" data-go="#/records?tab='+x[0]+'">'+x[1]+'</button>').join('')+'</div><div class="card"><div class="tw">'+body+'</div></div>'}
function pgSettings(){const s=S.settings,can=isManager(me)||hasRole(me,ROLE.SYS);
  return ph(t('Settings'),'Handover policy and the simulated clock')+'<div class="grid g2"><div class="card"><h3>Handover policy</h3><div class="cb"><form id="setf" data-do-form="set">'+fld('responseHours','Hours a receiver has to respond',s.responseHours,'number')+fld('leadHours','Send a reminder this many hours before the deadline',s.leadHours,'number')+fld('escalateHours','Escalate to managers this many hours after the deadline',s.escalateHours,'number')+'<button class="btn pri" type="button" data-do="saveSet"'+(can?'':' disabled')+'>'+t('Save')+'</button>'+(can?'':' <span class="muted">Managers only.</span>')+'</form></div></div>'+
  '<div class="card"><h3>Simulated clock</h3><div class="cb"><p style="margin-top:0">Now: <b>'+fmt(now())+'</b>. Move time forward, then run the hourly job to see reminders, overdue alerts and escalation.</p><div class="row"><button class="btn" data-do="adv" data-h="1">+1 hour</button><button class="btn" data-do="adv" data-h="24">+1 day</button><button class="btn" data-do="adv" data-h="72">+3 days</button><button class="btn pri" data-do="runRem">Run reminder job</button></div></div></div></div>'}
function pgScenarios(){const R=pageSt.scn||[],ok=R.filter(r=>r&&r.pass).length;
  return ph(t('Scenarios'),R.length?ok+' of '+SCENARIOS.length+' pass':'The ten mandatory scenarios, run on a throw-away copy of the demo','<button class="btn pri" data-do="runAll">'+t('Run all scenarios')+'</button>')+'<div class="card">'+SCENARIOS.map((s,i)=>{const r=R[i];return '<div class="scn"><span class="no">'+(i+1)+'</span><div><b>'+esc(s.t)+'</b>'+(r?'<ul>'+r.checks.map(c=>'<li class="'+(c.ok?'p':'f')+'">'+(c.ok?'✓ ':'✗ ')+esc(c.l)+'</li>').join('')+'</ul>':'')+'</div><span>'+(r?(r.pass?'<span class="pill p-accepted">PASS</span>':'<span class="pill p-rejected">FAIL</span>'):'<button class="btn sm" data-do="runOne" data-i="'+i+'">Run</button>')+'</span></div>'}).join('')+'</div>'}
function ROUTES(path,q){
  if(path==='/')return pgOverview();if(path==='/handovers')return pgHandovers(q);if(path.startsWith('/h/'))return pgHandover(path.slice(3));
  if(path==='/tasks')return pgTasks(q);if(path.startsWith('/t/'))return pgTask(path.slice(3));if(path==='/org')return pgOrg();if(path==='/reports')return pgReports(q);
  if(path==='/ledger')return pgLedger(q);if(path==='/delegations')return pgDelegations();if(path==='/notifications')return pgNotifs();if(path==='/records')return pgRecords(q);
  if(path==='/settings')return pgSettings();if(path==='/scenarios')return pgScenarios();return ph('Not found')+'<div class="note bad">There is no page at '+esc(path)+'.</div>'}

/* ===== UI: actions and start ===== */
const rq=i=>reqIds[i]=reqIds[i]||('rq-'+Math.random().toString(36).slice(2,9));
const collect=()=>{const p={};document.querySelectorAll('[data-fld]').forEach(e=>p[e.dataset.fld]=e.value);return p};
const people=ex=>Object.keys(USERS).filter(u=>u!=='admin'&&!hasRole(u,ROLE.AUD)&&u!==ex).map(u=>[u,USERS[u].name+' — '+USERS[u].dept]);
const myTasks=()=>visT(me).filter(x=>!CLOSED_T.includes(x.status)&&(ownerOf(x.id)===me||isManager(me))&&!S.handovers.some(h=>h.task===x.id&&(OPEN_H.includes(h.status)||h.status==='Draft')));
const chkbox=(n,l)=>'<label class="chk"><input type="checkbox" name="'+n+'"><span>'+l+'</span></label>';
function curQ(){return parse()}
const DO={
 go:el=>go(el.dataset.go),
 reset:()=>{seed();me='sara';reqIds={};pageSt={};bellOpen=false;save();toast('Demo data restored.');if(location.hash&&location.hash!=='#/'){go('#/')}else render()},
 menu:()=>{sideOpen=!sideOpen;render()},lang:()=>{lang=lang==='ar'?'en':'ar';save();render()},theme:()=>{theme=theme==='dark'?'light':'dark';save();render()},bell:()=>{bellOpen=!bellOpen;render()},
 readall:()=>{S.notifications.filter(n=>n.user===me).forEach(n=>n.read=true);save();render()},
 readone:el=>{const n=S.notifications.find(x=>x.id===+el.dataset.id);if(n)n.read=true;bellOpen=false;save()},
 pg:el=>{const {path,q}=curQ();q.p=el.dataset.v;go('#'+path+'?'+Object.keys(q).map(k=>k+'='+encodeURIComponent(q[k])).join('&'))},
 newH:()=>{const ts=myTasks();if(!ts.length)return toast('You own no open task without a handover. Create or pick one on the Tasks page.',true);
   modal({title:t('New handover'),ok:'Create draft',body:fld('task','Task',ts[0].id,'sel',ts.map(x=>[x.id,x.id+' — '+x.subject]))+fld('rcv','Receiver',people(me)[0][0],'sel',people(me)),run:v=>createHandover(me,v.task,v.rcv),after:h=>go(L(h.id))})},
 handT:el=>modal({title:t('Hand over')+' '+el.dataset.id,ok:'Create draft',body:fld('rcv','Receiver',people(ownerOf(el.dataset.id))[0][0],'sel',people(ownerOf(el.dataset.id))),run:v=>createHandover(me,el.dataset.id,v.rcv),after:h=>go(L(h.id))}),
 newTask:()=>modal({title:'New task',ok:'Create task',body:fld('subject','Subject','')+fld('project','Project','')+fld('priority','Priority','Medium','sel',['Low','Medium','High','Urgent'].map(x=>[x,x]))+fld('due','Due date',dateOf(now()+7*D),'date')+(isManager(me)?fld('who','Owner',me,'sel',people()):''),
   run:v=>{if(!v.subject.trim())fail('Give the task a subject.');if(!v.due)fail('Choose a due date.');return mkTask({subject:v.subject.trim(),project:v.project,priority:v.priority,due:v.due,assignee:isManager(me)?v.who:me,creator:me})},after:x=>go(LT(x.id)),msg:'Task created'}),
 saveDraft:el=>act(()=>updateDraft(me,el.dataset.id,collect()),'Draft saved'),
 ready:el=>act(()=>{updateDraft(me,el.dataset.id,collect());markReady(me,el.dataset.id)},'Marked ready: required data is complete'),
 submit:el=>act(()=>{updateDraft(me,el.dataset.id,collect());markReady(me,el.dataset.id);return submit(me,el.dataset.id,rq(el.dataset.id))},'Submitted. The snapshot is frozen and hashed.'),
 submit2:el=>{const i=el.dataset.id;const r=act(()=>{updateDraft(me,i,collect());markReady(me,i);const a=submit(me,i,rq(i)),b=submit(me,i,rq(i));return a===b});if(r)toast('The retry returned the same handover. Nothing was duplicated.')},
 review:el=>act(()=>startReview(me,el.dataset.id),'Review started'),
 accept:el=>{const i=el.dataset.id,rv=+el.dataset.rv;modal({title:'Accept handover '+i,ok:'Accept and take ownership',cls:'ok',body:'<div class="note">Ownership moves to you only when you confirm.</div>'+chkbox('c1','I read the task details, diagnosis, solution and results.')+chkbox('c2','I received and opened the files, images and links.')+chkbox('c3','I understand and accept the responsibility.')+fld('notes','Receiver notes','','ta')+fld('next','Next step','')+fld('dummy','','','hidden'),
   run:v=>accept(me,i,{details:v.c1,attachments:v.c2,responsibilities:v.c3,notes:v.notes,nextStep:v.next},rv),msg:'Accepted. Responsibility moved.'})},
 reject:el=>{const i=el.dataset.id;modal({title:'Reject handover '+i,ok:'Reject handover',cls:'bad',body:'<div class="note bad">Ownership stays with the sender.</div>'+fld('reason','Reason (required)','','sel',[['','Choose a reason…'],...REASONS.map(r=>[r,r])])+fld('details','Details (required)','','ta'),run:v=>reject(me,i,v.reason,v.details),msg:'Rejected. The sender still owns the task.'})},
 clarify:el=>{const i=el.dataset.id;modal({title:'Request clarification on '+i,ok:'Send request',cls:'warn',body:'<div class="note">This is neither acceptance nor rejection. The sender still owns the task.</div>'+fld('text','What do you need?','','ta'),run:v=>clarify(me,i,v.text),msg:'Clarification requested'})},
 withdraw:el=>{const i=el.dataset.id;modal({title:'Withdraw '+i,ok:'Withdraw',body:fld('reason','Reason','','ta'),run:v=>withdraw(me,i,v.reason),msg:'Withdrawn'})},
 revise:el=>{const n=act(()=>revise(me,el.dataset.id),'New version created. Complete it and submit.');if(n)go(L(n.id))},
 tryAccept:el=>act(()=>accept(me,el.dataset.id,CONF)),
 verify:el=>{const h=getH(el.dataset.id);toast(verify(h)?'Integrity verified: the stored snapshot matches its hash.':'Integrity check FAILED: the record was changed after submission.',!verify(h))},
 tamper:el=>{const h=getH(el.dataset.id);h.snapshot+=' ';log(h,'Tamper test',me,'Snapshot altered in the simulation to show detection','bad');save();toast('Snapshot altered. Press “Verify integrity”.');render()},
 addAtt:el=>modal({title:'Add attachment',ok:'Add',body:fld('kind','Type','file','sel',[['file','File'],['image','Image or screenshot'],['link','Link']])+fld('name','File name or URL',''),run:v=>{const h=getH(el.dataset.id);if(h.status!=='Draft'||h.sender!==me)fail('Only the sender can attach to a draft.','perm');if(!v.name.trim())fail('Enter a name or URL.');if(v.kind==='link'&&!/^https?:\/\//.test(v.name.trim()))fail('A link must start with http:// or https://.');updateDraft(me,h.id,collect());h.attachments.push({id:id('ATT'),name:v.name.trim(),kind:v.kind});h.ready=false;h.rv++}}),
 rmAtt:el=>act(()=>{const h=getH(el.dataset.id);if(h.status!=='Draft'||h.sender!==me)fail('Only the sender can change a draft.','perm');updateDraft(me,h.id,collect());h.attachments.splice(+el.dataset.i,1);h.ready=false}),
 postUpd:el=>modal({title:'Post update',ok:'Post update',body:fld('type','Type','Progress','sel',['Progress','Note','Blocker','Help request'].map(x=>[x,x]))+fld('note','Note','','ta')+fld('pct','Progress % (for Progress)','','number')+fld('link','Link (optional)',''),run:v=>postUpdate(me,el.dataset.id,v.type,v.note,v.pct,v.link),msg:'Update posted'}),
 addChk:el=>modal({title:'Add completion criterion',ok:'Add',body:fld('title','Criterion','')+'<label class="chk"><input type="checkbox" name="req" checked><span>Required before the task can be completed</span></label>',run:v=>addCheck(me,el.dataset.id,v.title,v.req)}),
 chk:el=>act(()=>toggleCheck(me,el.dataset.id)),
 complete:el=>act(()=>completeTask(me,el.dataset.id),'Task completed'),
 reviewT:el=>modal({title:'Review '+el.dataset.id,ok:'Save review',body:fld('verdict','Verdict','Approved','sel',[['Approved','Approved'],['Changes requested','Changes requested']])+fld('score','Quality score (1-5, required to approve)','4','number')+fld('comments','Comments','','ta'),run:v=>reviewTask(me,el.dataset.id,v.verdict,+v.score,v.comments),msg:'Review saved'}),
 profile:el=>modal({title:uname(el.dataset.id),ok:'Close',body:profile(el.dataset.id),run:()=>0}),
 csv:el=>{const {q}=curQ(),rp=REPORTS.find(x=>x.slug===el.dataset.r),out=rp.build(me,{from:q.from||'',to:q.to||''});const cell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
   const txt='﻿'+[out.cols.map(c=>cell(c.l)).join(',')].concat(out.rows.map(r=>out.cols.map(c=>cell(r[c.k])).join(','))).join('\r\n');
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='nds-'+rp.slug+'.csv';document.body.appendChild(a);a.click();a.remove();toast('CSV exported: '+out.rows.length+' rows')},
 print:()=>window.print(),
 rfilter:el=>go('#/reports?r='+el.dataset.r+'&from='+$('#rf-from').value+'&to='+$('#rf-to').value),
 newDel:()=>modal({title:'Delegate my approvals',ok:'Create delegation',body:fld('to','Delegate',people(me)[0][0],'sel',people(me))+fld('from','From',dateOf(now()),'date')+fld('until','Until',dateOf(now()+3*D),'date')+fld('reason','Reason','','ta'),run:v=>delegate(me,v.to,v.from,v.until,v.reason),msg:'Delegation created'}),
 revokeDel:el=>act(()=>revokeDelegation(me,el.dataset.id),'Delegation revoked'),
 saveSet:()=>act(()=>{const g=n=>+document.getElementById('f-'+n).value;const a=g('responseHours'),b=g('leadHours'),c=g('escalateHours');if(!(a>0&&b>=0&&c>=0))fail('Enter positive hours.');if(!(isManager(me)||hasRole(me,ROLE.SYS)))fail('Only managers can change the policy.','perm');Object.assign(S.settings,{responseHours:a,leadHours:b,escalateHours:c})},'Policy saved. It applies to handovers submitted from now on.'),
 adv:el=>{advance(+el.dataset.h*H);save();toast('Clock moved forward '+el.dataset.h+' h');render()},
 runRem:()=>{const n=runReminders();save();toast(n?'Reminder job created '+n+' notice(s).':'Reminder job ran. Nothing was due.');render()},
 freeze:()=>act(()=>{const per=dateOf(now()).slice(0,7);let n=0;perGroup(me,DEF,'dept').forEach(r=>{if(!S.kpi.some(k=>k.period===per&&k.dept===r.name)){S.kpi.push(Object.freeze(Object.assign({period:per,dept:r.name,at:now()},r)));n++}});if(!n)fail('This month is already frozen. A snapshot is never rewritten.','conflict');return n},'Monthly KPI snapshot frozen'),
 runOne:el=>{pageSt.scn=pageSt.scn||[];pageSt.scn[+el.dataset.i]=runScenario(+el.dataset.i);render()},
 runAll:()=>{pageSt.scn=SCENARIOS.map((s,i)=>runScenario(i));const ok=pageSt.scn.filter(r=>r.pass).length;toast(ok+' of '+SCENARIOS.length+' scenarios pass',ok!==SCENARIOS.length);render()}
};
let inpTimer;
function bind(root){
  root.onclick=e=>{const el=e.target.closest('[data-do]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;if(el.tagName==='A'&&el.dataset.do==='go')return;const f=DO[el.dataset.do];if(f){if(el.tagName==='BUTTON'||el.tagName==='TR')e.preventDefault();f(el,e)}};
  root.onchange=e=>{const el=e.target;if(el.id==='who'){me=el.value;bellOpen=false;save();render();return}
    if(el.dataset.chg==='chk')return DO.chk(el);
    if(el.dataset.chg==='pref'){const p=S.prefs[me]=S.prefs[me]||{reminders:true,progress:true};p[el.dataset.k]=el.checked;save();toast('Notification setting saved')}};
  root.oninput=e=>{const el=e.target;if(el.dataset.inp!=='q')return;clearTimeout(inpTimer);inpTimer=setTimeout(()=>{pageSt.q=el.value;pageSt.focus=el.id;const {path,q}=curQ();if(q.p){delete q.p;go('#'+path+'?'+Object.keys(q).map(k=>k+'='+q[k]).join('&'))}else render()},250)}}
const _render=render;render=function(){_render();if(pageSt.focus){const el=document.getElementById(pageSt.focus);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}pageSt.focus=null}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(bellOpen){bellOpen=false;render()}}});
(function init(){if(!load()){seed();save()}render()})();


</script></body></html>
