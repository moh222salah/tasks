<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="NDS Enterprise Operations - One Organization. Connected Teams. Clear Ownership. Measurable Results.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06162b"/><stop offset=".55" stop-color="#0A2342"/><stop offset="1" stop-color="#164E8F"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6d1c"/><stop offset=".5" stop-color="#f3d36b"/><stop offset="1" stop-color="#D4AF37"/></linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7fa8d8" stroke-opacity=".10"/></pattern>
  <radialGradient id="orb1"><stop offset="0" stop-color="#D4AF37" stop-opacity=".35"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2"><stop offset="0" stop-color="#3f8de0" stop-opacity=".45"/><stop offset="1" stop-color="#3f8de0" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1280" height="440" rx="22"/></clipPath>
  <path id="track" d="M110 352 H1170"/>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
  .eyebrow{fill:#D4AF37;font-size:15px;font-weight:700;letter-spacing:6px;opacity:0;animation:rise 1s .2s forwards}
  .h1{fill:#fff;font-size:58px;font-weight:800;letter-spacing:-1px;opacity:0;animation:rise 1s .5s forwards}
  .h2{fill:url(#gold);font-size:58px;font-weight:800;letter-spacing:-1px;opacity:0;animation:rise 1s .75s forwards}
  .tag{fill:#c9d8ec;font-size:19px;letter-spacing:.4px;opacity:0;animation:rise 1s 1.1s forwards}
  .lbl{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#9fb7d6;font-size:14px;font-weight:600;letter-spacing:.5px}
  .lblhot{fill:#f3d36b;font-weight:800}
  .ring{fill:none;stroke:#3f8de0;stroke-width:2;opacity:.6}
  .core{fill:#9fc6f3}
  .hot .ring{stroke:#D4AF37} .hot .core{fill:#f3d36b}
  .node{animation:ping 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .node .ring{animation:ringpulse 9s ease-in-out infinite;animation-delay:inherit;transform-box:fill-box;transform-origin:center}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes ringpulse{0%,8%,100%{transform:scale(1);opacity:.55}4%{transform:scale(1.7);opacity:1}}
  @keyframes ping{0%,100%{opacity:.85}4%{opacity:1}}
  @keyframes sweepmove{from{transform:translateX(-1400px)}to{transform:translateX(1400px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<g clip-path="url(#clip)">
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <circle r="260" fill="url(#orb1)"><animate attributeName="cx" values="1020;900;1020" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="90;170;90" dur="11s" repeatCount="indefinite"/></circle>
  <circle r="320" fill="url(#orb2)"><animate attributeName="cx" values="160;320;160" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="300;190;300" dur="13s" repeatCount="indefinite"/></circle>
  <rect x="0" y="0" width="360" height="440" fill="url(#sweep)" transform="skewX(-18)" style="animation:sweepmove 7s linear infinite"/>
  <text x="80" y="92" class="t eyebrow">NDS ENTERPRISE OPERATIONS</text>
  <text x="80" y="170" class="t h1">Teams &amp; Operations</text>
  <text x="80" y="236" class="t h2">Management</text>
  <text x="80" y="284" class="t tag">One Organization. Connected Teams. Clear Ownership. Measurable Results.</text>
  <rect x="80" y="104" width="120" height="3" rx="2" fill="url(#gold)"><animate attributeName="width" values="0;120;120" keyTimes="0;.2;1" dur="3s" fill="freeze"/></rect>
  <use href="#track" stroke="#2a5b95" stroke-width="2" fill="none" stroke-dasharray="3 7"/>
  <use href="#track" stroke="url(#gold)" stroke-width="2.5" fill="none" stroke-dasharray="1060" stroke-dashoffset="1060"><animate attributeName="stroke-dashoffset" values="1060;0;0;1060" keyTimes="0;.55;.92;1" dur="9s" repeatCount="indefinite"/></use>
<g class="node" style="animation-delay:0.00s">
  <circle cx="110" cy="352" r="8" class="ring"/>
  <circle cx="110" cy="352" r="4" class="core"/>
  <text x="110" y="386" text-anchor="middle" class="lbl">Company</text></g>
<g class="node" style="animation-delay:1.00s">
  <circle cx="242" cy="352" r="8" class="ring"/>
  <circle cx="242" cy="352" r="4" class="core"/>
  <text x="242" y="386" text-anchor="middle" class="lbl">Department</text></g>
<g class="node" style="animation-delay:2.00s">
  <circle cx="375" cy="352" r="8" class="ring"/>
  <circle cx="375" cy="352" r="4" class="core"/>
  <text x="375" y="386" text-anchor="middle" class="lbl">Team</text></g>
<g class="node" style="animation-delay:3.00s">
  <circle cx="508" cy="352" r="8" class="ring"/>
  <circle cx="508" cy="352" r="4" class="core"/>
  <text x="508" y="386" text-anchor="middle" class="lbl">Employee</text></g>
<g class="node" style="animation-delay:4.00s">
  <circle cx="640" cy="352" r="8" class="ring"/>
  <circle cx="640" cy="352" r="4" class="core"/>
  <text x="640" y="386" text-anchor="middle" class="lbl">Project</text></g>
<g class="node" style="animation-delay:5.00s">
  <circle cx="772" cy="352" r="8" class="ring"/>
  <circle cx="772" cy="352" r="4" class="core"/>
  <text x="772" y="386" text-anchor="middle" class="lbl">Task</text></g>
<g class="node hot" style="animation-delay:6.00s">
  <circle cx="905" cy="352" r="11" class="ring"/>
  <circle cx="905" cy="352" r="5" class="core"/>
  <text x="905" y="386" text-anchor="middle" class="lbl lblhot">Handover</text></g>
<g class="node hot" style="animation-delay:7.00s">
  <circle cx="1038" cy="352" r="11" class="ring"/>
  <circle cx="1038" cy="352" r="5" class="core"/>
  <text x="1038" y="386" text-anchor="middle" class="lbl lblhot">Acceptance</text></g>
<g class="node" style="animation-delay:8.00s">
  <circle cx="1170" cy="352" r="8" class="ring"/>
  <circle cx="1170" cy="352" r="4" class="core"/>
  <text x="1170" y="386" text-anchor="middle" class="lbl">Results</text></g>
  <g filter="url(#glow)"><circle r="7" fill="#fff"><animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.55;1" calcMode="linear"><mpath href="#track"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.55;.62;1" dur="9s" repeatCount="indefinite"/></circle></g>
</g>
<rect x=".5" y=".5" width="1279" height="439" rx="22" fill="none" stroke="#D4AF37" stroke-opacity=".35"/>
</svg>